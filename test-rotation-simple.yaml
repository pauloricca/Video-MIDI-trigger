source: "camera"

camera:
  width: 640
  height: 480
  fps: 30

triggers:
  # Rectangle rotating around center
  - name: "Rotating Box"
    position:
      x: 45
      y: 45
      width: 10
      height: 10
    type: "brightness"
    threshold: 150
    movement:
      center: [50, 50]
      speed: 45  # 45 degrees per second
    midi:
      note: 60
      velocity: 100
      channel: 0
